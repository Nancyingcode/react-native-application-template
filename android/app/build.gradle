apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

def brandProperties = new Properties()
def brandPropertiesFile = rootProject.file("../generated/native/android.properties")
if (brandPropertiesFile.exists()) {
    brandPropertiesFile.withInputStream { brandProperties.load(it) }
}
def brandVersionName = (project.findProperty("versionName") ?:
        System.getenv("APP_VERSION") ?:
        brandProperties.getProperty("versionName", "1.0.0")).toString()
if (!(brandVersionName ==~ /\d+(\.\d+){0,2}/)) {
    throw new GradleException("versionName must contain one to three numeric components")
}
def brandVersionCodeValue = (project.findProperty("versionCode") ?:
        System.getenv("BUILD_NUMBER") ?:
        brandProperties.getProperty("versionCode", "1")).toString()
if (!(brandVersionCodeValue ==~ /\d+/) ||
        brandVersionCodeValue.toLong() < 1 ||
        brandVersionCodeValue.toLong() > 2100000000L) {
    throw new GradleException("versionCode must be an integer between 1 and 2100000000")
}
def brandVersionCode = brandVersionCodeValue.toInteger()
def releaseSigningMode = (project.findProperty("releaseSigningMode") ?: "signed").toString()
if (!(releaseSigningMode in ["signed", "unsigned"])) {
    throw new GradleException("releaseSigningMode must be signed or unsigned")
}
def brandKeystore = System.getenv("BRAND_KEYSTORE_PATH") ?:
        brandProperties.getProperty("keystorePath", "")
def brandKeyAlias = System.getenv("BRAND_KEY_ALIAS") ?:
        brandProperties.getProperty("keyAlias", "")
def brandKeystorePassword = releaseSigningMode == "unsigned"
        ? null
        : System.getenv("BRAND_KEYSTORE_PASSWORD")
def brandKeyPassword = releaseSigningMode == "unsigned"
        ? null
        : System.getenv("BRAND_KEY_PASSWORD")
def brandKeystoreFile = brandKeystore
        ? (new File(brandKeystore).isAbsolute()
            ? file(brandKeystore)
            : rootProject.file("../${brandKeystore}"))
        : null
def releaseSigningReady = brandKeystoreFile?.isFile() && brandKeystoreFile.canRead() && brandKeyAlias &&
        brandKeystorePassword && brandKeyPassword
def cxxBuildDir = System.getenv("RN_CXX_BUILD_DIR")
if (!cxxBuildDir && System.getProperty("os.name").toLowerCase().contains("windows")) {
    def projectHash = Integer.toHexString(rootProject.projectDir.absolutePath.hashCode())
    cxxBuildDir = new File(System.getProperty("user.home"), ".rn-cxx/${projectHash}")
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    externalNativeBuild {
        cmake {
            if (cxxBuildDir) {
                // Keep native intermediates short enough for Windows/Ninja.
                buildStagingDirectory cxxBuildDir
            }
        }
    }

    namespace "com.whitelabelapp"
    defaultConfig {
        applicationId brandProperties.getProperty("applicationId", "com.whitelabelapp")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode brandVersionCode
        versionName brandVersionName
        manifestPlaceholders = [
            deepLinkScheme: brandProperties.getProperty("deepLinkScheme", "whitelabel"),
            deepLinkHost: brandProperties.getProperty("deepLinkHost", "app.example.com")
        ]
        buildConfigField "String", "BRAND_ID", "\"${brandProperties.getProperty('brandId', 'default')}\""
        buildConfigField "String", "APP_ENVIRONMENT", "\"${brandProperties.getProperty('environment', 'development')}\""
        buildConfigField "String", "CHANNEL_ID", "\"${brandProperties.getProperty('channelId', 'direct')}\""
        externalNativeBuild {
            cmake {
                // Force CMake to hash long object paths. React Native codegen can
                // otherwise exceed Windows' legacy 260-character path limit.
                arguments "-DCMAKE_OBJECT_PATH_MAX=240"
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningReady && releaseSigningMode == "signed") {
            release {
                storeFile brandKeystoreFile
                storePassword brandKeystorePassword
                keyAlias brandKeyAlias
                keyPassword brandKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Unsigned output is opt-in so missing CI secrets can never silently
            // downgrade a store build to a non-publishable artifact.
            signingConfig releaseSigningReady && releaseSigningMode == "signed"
                ? signingConfigs.release
                : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    group = "verification"
    description = "Validates the requested release signing mode"

    doLast {
        if (releaseSigningMode == "unsigned") {
            logger.lifecycle("Release signing mode: unsigned (non-publishable artifact).")
            return
        }

        def failures = []
        if (!brandKeystore) failures << "BRAND_KEYSTORE_PATH/native.android.keystorePath"
        if (brandKeystoreFile && !brandKeystoreFile.isFile()) failures << "keystore file"
        if (brandKeystoreFile?.isFile() && !brandKeystoreFile.canRead()) failures << "readable keystore file"
        if (!brandKeyAlias) failures << "BRAND_KEY_ALIAS/native.android.keyAlias"
        if (!brandKeystorePassword) failures << "BRAND_KEYSTORE_PASSWORD"
        if (!brandKeyPassword) failures << "BRAND_KEY_PASSWORD"
        if (!failures.isEmpty()) {
            throw new GradleException(
                "Release signing is incomplete: ${failures.join(', ')}. " +
                "Use -PreleaseSigningMode=unsigned only for a non-publishable verification package."
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn(verifyReleaseSigning)
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
